		<script>
			(function () {
				try {
					document.getElementById("transport").value = localStorage.getItem("proxy_transport") || "libcurl";
					document.getElementById("protocol").value = localStorage.getItem("proxy_protocol") || "auto";
					document.getElementById("wisp").value = localStorage.getItem("proxy_wisp") || "";
					document.getElementById("cloak-title").value = localStorage.getItem("cloak_title") || "";
					document.getElementById("cloak-icon").value = localStorage.getItem("cloak_icon") || "";
					document.getElementById("cloak-key").value = localStorage.getItem("cloak_panic_key") || "";
					document.getElementById("cloak-url").value = localStorage.getItem("cloak_panic_url") || "";
				} catch (e) {}
				document.getElementById("save").addEventListener("click", function () {
					try {
						localStorage.setItem("proxy_transport", document.getElementById("transport").value);
						localStorage.setItem("proxy_protocol", document.getElementById("protocol").value);
						localStorage.setItem("proxy_wisp", document.getElementById("wisp").value);
						localStorage.setItem("cloak_title", document.getElementById("cloak-title").value);
						localStorage.setItem("cloak_icon", document.getElementById("cloak-icon").value);
						localStorage.setItem("cloak_panic_key", document.getElementById("cloak-key").value);
						localStorage.setItem("cloak_panic_url", document.getElementById("cloak-url").value);
					} catch (e) {}
					alert("Saved. Reload to apply.");
				});

				// Export
				document.getElementById("export-btn").addEventListener("click", function () {
					const data = {};
					for (let i = 0; i < localStorage.length; i++) {
						const k = localStorage.key(i);
						data[k] = localStorage.getItem(k);
					}
					const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
					const a = document.createElement("a");
					a.href = URL.createObjectURL(blob);
					a.download = "backup.json";
					a.click();
					URL.revokeObjectURL(a.href);
				});

				// Import
				document.getElementById("import-file").addEventListener("change", function (e) {
					const file = e.target.files[0];
					if (!file) return;
					const reader = new FileReader();
					reader.onload = function (ev) {
						try {
							const data = JSON.parse(ev.target.result);
							Object.keys(data).forEach(function (k) {
								localStorage.setItem(k, data[k]);
							});
							alert("Imported. Reload to apply.");
						} catch (err) {
							alert("Import failed");
						}
					};
					reader.readAsText(file);
				});
			})();
		</script>
