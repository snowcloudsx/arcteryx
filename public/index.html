		<script>
			(function () {
				const canvas = document.getElementById("drip-canvas");
				if (!canvas) return;
				const ctx = canvas.getContext("2d");
				let w, h;
				function resize() {
					w = canvas.width = window.innerWidth;
					h = canvas.height = window.innerHeight;
				}
				resize();
				window.addEventListener("resize", resize);

				const drops = [];
				function spawn() {
					drops.push({
						x: Math.random() * w,
						y: -10,
						vy: 1 + Math.random() * 2,
						len: 20 + Math.random() * 40,
						alpha: 0.3 + Math.random() * 0.5,
					});
				}

				function frame() {
					ctx.clearRect(0, 0, w, h);
					if (Math.random() < 0.05) spawn();
					for (let i = drops.length - 1; i >= 0; i--) {
						const d = drops[i];
						d.y += d.vy;
						d.vy += 0.05;
						ctx.strokeStyle = "rgba(255,255,255," + d.alpha + ")";
						ctx.lineWidth = 1;
						ctx.beginPath();
						ctx.moveTo(d.x, d.y - d.len);
						ctx.lineTo(d.x, d.y);
						ctx.stroke();
						if (d.y > h + 20) drops.splice(i, 1);
					}
					requestAnimationFrame(frame);
				}
				frame();
			})();
		</script>
