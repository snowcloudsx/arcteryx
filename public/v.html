<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Play - Arc'teryx Proxy</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="/index.css" />
		<meta name="robots" content="noindex" />
		<script src="/bootstrap-init.js"></script>
		<style>
			body { justify-content: flex-start; overflow: hidden; }
			.play-wrap { width: 100%; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
			.play-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(10,10,10,0.9); border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px); flex-wrap: wrap; }
			.play-bar a, .play-bar button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #f5f5f5; padding: 7px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; text-decoration: none; font-family: inherit; }
			.play-bar a:hover, .play-bar button:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
			.play-bar .title { flex: 1; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); min-width: 120px; }
			.play-frame { flex: 1; border: none; width: 100%; background: #000; }
		</style>
	<script src="/cloak.js"></script>
	</head>
	<body>
		<div class="topline" aria-hidden="true"></div>
		<button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
			<img src="arcteryx.svg" alt="" class="ham-logo" />
		</button>
		<nav class="menu" id="menu" aria-hidden="true">
			<a href="/">Home</a>
			<a href="/r">Resources</a>
			<a href="/g">Activities</a>
			<a href="/m">Media</a>
			<a href="/s">Settings</a>
		</nav>

		<div class="play-wrap">
			<div class="play-bar">
				<a href="/g">Back</a>
				<span class="title" id="title">Game</span>
				<button id="btn-full">Fullscreen</button>
				<button id="btn-copy">Copy link</button>
				<button id="btn-dl">Download</button>
			</div>
			<iframe class="play-frame" id="frame"></iframe>
		</div>

\t\t<script src="/menu.js"></script>

		<script src="/search.js"></script>
		<script>
			const params = new URLSearchParams(location.search);
			const url = params.get("u");
			const name = params.get("n") || "Game";
			document.getElementById("title").textContent = name;

			let controller, frame;
			async function init() {
				controller = await initBootstrap();
				const cachePlugin = new $scramjetUtils.HttpCachePlugin();
				frame = controller.createFrame(document.getElementById("frame"), {
					plugins: [cachePlugin],
				});
				if (url) await frame.go(url);
			}
			init().catch((e) => console.error(e));

			document.getElementById("btn-full").addEventListener("click", () => {
				const f = document.getElementById("frame");
				if (f.requestFullscreen) f.requestFullscreen();
			});
			document.getElementById("btn-copy").addEventListener("click", async () => {
				try { await navigator.clipboard.writeText(url); document.getElementById("btn-copy").textContent = "Copied"; setTimeout(() => document.getElementById("btn-copy").textContent = "Copy link", 1200); } catch (e) {}
			});
			document.getElementById("btn-dl").addEventListener("click", async () => {
				try {
					const res = await fetch(url);
					const html = await res.text();
					const blob = new Blob([html], { type: "text/html" });
					const a = document.createElement("a");
					a.href = URL.createObjectURL(blob);
					a.download = name.replace(/[^a-z0-9]/gi, "_") + ".html";
					a.click();
					URL.revokeObjectURL(a.href);
				} catch (e) { alert("Download failed"); }
			});
		</script>
	</body>
</html>
