				if (input) {
					input.addEventListener("input", function () {
						var q = input.value.toLowerCase();
						document.querySelectorAll("#grid .tile").forEach(function (t) {
							var txt = t.textContent.toLowerCase();
							t.style.display = txt.includes(q) ? "" : "none";
						});
					});
				}
			})();
